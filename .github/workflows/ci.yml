name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cipherpad
          POSTGRES_PASSWORD: cipherpad
          POSTGRES_DB: cipherpad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherpad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://cipherpad:cipherpad@localhost:5432/cipherpad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cipherpad/crypto build
      - run: pnpm --filter @cipherpad/crypto typecheck
      - run: pnpm --filter @cipherpad/crypto lint
      - run: pnpm --filter @cipherpad/crypto test
      - run: pnpm --filter @cipherpad/server build
      - run: pnpm --filter @cipherpad/server typecheck
      - run: pnpm --filter @cipherpad/server lint
      - run: pnpm --filter @cipherpad/server test
      - run: pnpm --filter @cipherpad/client typecheck
      - run: pnpm --filter @cipherpad/client lint
      - run: pnpm --filter @cipherpad/client test
      - run: pnpm --filter @cipherpad/client build
      - run: pnpm --filter @cipherpad/client exec playwright install --with-deps chromium
      - run: pnpm --filter @cipherpad/client test:e2e
      - run: pnpm audit --audit-level=high
